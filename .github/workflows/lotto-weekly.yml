# 매주 일요일 오전 6시 10분(한국시간): 당첨번호 수집 → 채점
name: lotto-weekly

on:
  schedule:
    - cron: '10 21 * * 6'   # UTC 토 21:10 = KST 일 06:10
  workflow_dispatch:         # GitHub 화면에서 수동 실행 버튼

jobs:
  sunday:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node run.mjs sunday
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
