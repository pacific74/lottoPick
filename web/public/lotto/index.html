<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또픽 다운로드</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d1f27; --sub:#666; --accent:#e8452c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151a; --card:#1f2128; --text:#eee; --sub:#aaa; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; max-width:420px; width:100%;
          text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.08); }
  .balls { font-size:0; margin-bottom:16px; }
  .balls span { display:inline-block; width:36px; height:36px; line-height:36px; border-radius:50%;
                margin:0 3px; color:#fff; font-size:15px; font-weight:700; }
  h1 { font-size:24px; margin:0 0 6px; }
  .ver { color:var(--sub); font-size:14px; margin-bottom:24px; }
  .btn { display:block; background:var(--accent); color:#fff; text-decoration:none; font-size:18px;
         font-weight:700; padding:16px; border-radius:14px; }
  .btn:active { opacity:.85; }
  .note { text-align:left; color:var(--sub); font-size:13px; line-height:1.6; margin-top:24px; }
  .note b { color:var(--text); }
</style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="로또픽" width="120" height="120" style="border-radius:26px;margin-bottom:16px">
    <h1>로또픽</h1>
    <div class="ver">버전 0.0.1 · Android</div>
    <a class="btn" href="lotto_0.0.1.apk" download>APK 다운로드</a>
    <div class="note">
      <b>설치 방법</b><br>
      1. 버튼을 눌러 APK를 받습니다.<br>
      2. 다운로드한 파일을 엽니다.<br>
      3. "출처를 알 수 없는 앱" 경고가 나오면 사용 중인 브라우저(크롬 등)에 설치 허용을 켭니다.<br>
      4. 설치를 누르면 끝입니다.
    </div>
  </div>
</body>
</html>
